plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'java'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "ore-oracle" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

// Compile-only stub of the MC Widgets API (26.x types), so the optional
// integration links now and works as soon as a 26.x mc-widgets is installed.
// Never packaged into the jar; the real classes come from mc-widgets at runtime.
// Replace with a compileOnly dep on the real jar once mc-widgets is ported.
sourceSets {
    mcwidgetsStub
}
afterEvaluate {
    // Capture the client classpath first, then extend it with the stub output,
    // so the stub compiles against Minecraft/Fabric without a circular dependency.
    def clientClasspath = sourceSets.client.compileClasspath
    sourceSets.mcwidgetsStub.compileClasspath += clientClasspath
    sourceSets.client.compileClasspath = clientClasspath + sourceSets.mcwidgetsStub.output
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Mod Menu integration (optional at runtime)
    compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"

    // MC Widgets integration (optional at runtime) compiles against the local
    // 26.x API stub in src/mcwidgetsStub (wired onto the client classpath above)
    // until mc-widgets publishes a 26.x jar
}

processResources {
    def modVersion = project.version
    inputs.property "version", modVersion

    filesMatching("fabric.mod.json") {
        expand "version": modVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${base.archivesName.get()}" }
    }
}
